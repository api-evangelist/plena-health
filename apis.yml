aid: plena-health
name: Plena Health
description: >-
  Plena Health is an AI operating system for specialty medical practices,
  founded in 2025 and part of Y Combinator's Spring 2026 batch. Plena automates
  the complex administrative workflows a clinic's staff shouldn't have to do —
  referrals, fax intake, patient calls, scheduling, prior authorization,
  procedure compliance, and collections — end to end, running in the background
  across the EHRs, clearinghouses, and other systems a practice already uses,
  rather than requiring the practice to adopt new software. Founded by Eyad
  Abdalla (CEO) and Ahmed Al Mudarris (CTO) and based in San Francisco, the
  company reports operating across six specialties in eight states. This profile
  was surfaced as a Y Combinator portfolio company and added to the API
  Evangelist network; as of this enrichment pass Plena publishes only a
  marketing site (a single-page React application) with no public API,
  developer portal, documentation, or well-known discovery surface.
